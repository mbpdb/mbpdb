events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    
    # WebSocket and proxy buffering settings
    proxy_buffering off;
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;
    
    # Allow large file uploads (Excel files can be 100MB+)
    client_max_body_size 200m;

    # Increase timeouts for long-running connections
    proxy_connect_timeout 300;
    proxy_send_timeout 300;
    proxy_read_timeout 300;
    send_timeout 300;

    upstream django {
        server 127.0.0.1:8001;
    }
    
    server {
        listen 0.0.0.0:8000;
        server_name localhost;

        # Django
        location / {
            proxy_pass http://django;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # Pass through the original protocol from Azure load balancer
            # so Django knows the request was HTTPS
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        location /static/ {
            alias /app/include/peptide/static_files/;
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }
    }
}