name: Scheduled Container Restart

on:
  schedule:
    # Runs every 12 hours (at 0:00, 12:00 UTC)
    - cron: '0 */12 * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  restart:
    runs-on: ubuntu-latest
    steps:
      - name: Azure Login
        uses: azure/login@v3
        with:
          creds: ${{ secrets.MBPDBCONTAINER_AZURE_CREDENTIALS_UPDATED }}

      - name: Restart Container App
        run: |
          set -euo pipefail
          az config set extension.use_dynamic_install=yes_without_prompt --only-show-errors
          REVISION=$(az containerapp revision list \
            --name mbpdbcontainer \
            --resource-group COH_MBPDB_RG \
            --query "[?properties.active].name | [0]" -o tsv --only-show-errors)
          if [ -z "$REVISION" ]; then
            echo "No active revision found for mbpdbcontainer" >&2
            exit 1
          fi
          echo "Restarting active revision: $REVISION"
          az containerapp revision restart \
            --name mbpdbcontainer \
            --resource-group COH_MBPDB_RG \
            --revision "$REVISION" \
            --only-show-errors

